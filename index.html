<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#f4f6f2">
	<title>Energy Data Charts</title>
	<link rel="stylesheet" href="styles.css">
	<script src="https://cdn.jsdelivr.net/npm/d3@7" defer></script>
	<script src="load-data.js" defer></script>
</head>
<body>
	<main class="dashboard">
		<header class="page-header">
			<p class="eyebrow">DATA OVERVIEW</p>
			<h1>Energy at a glance</h1>
			<p class="intro">Explore the patterns across four views of the data.</p>
		</header>

		<section class="chart-grid" aria-label="Energy data charts">
			<article class="chart-panel">
				<div class="panel-heading">
					<span class="chart-index">01</span>
					<h2>Scatter plot</h2>
				</div>
				<div class="chart" id="scatter-chart" role="img" aria-label="Scatter plot chart"></div>
			</article>

			<article class="chart-panel">
				<div class="panel-heading">
					<span class="chart-index">02</span>
					<h2>Donut chart</h2>
				</div>
				<div class="chart" id="donut-chart" role="img" aria-label="Donut chart"></div>
			</article>

			<article class="chart-panel">
				<div class="panel-heading">
					<span class="chart-index">03</span>
					<h2>Bar chart</h2>
				</div>
				<div class="chart" id="bar-chart" role="img" aria-label="Bar chart"></div>
			</article>

			<article class="chart-panel">
				<div class="panel-heading">
					<span class="chart-index">04</span>
					<h2>Line chart</h2>
				</div>
				<div class="chart" id="line-chart" role="img" aria-label="Line chart"></div>
			</article>
		</section>
	</main>
</body>
</html>
